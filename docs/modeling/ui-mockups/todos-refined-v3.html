<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caldav — todos card v3(カード内ページ遷移 × v1 言語)</title>
<style>
/* ============================================================
   v3: v2(iOS 借景のボトムシート)の反省を全部畳み込む。
   - 構造: オーバーレイをやめ「カード内ページ遷移」(一覧 ⇄ 詳細)。
     MCP Apps の iframe はコンテンツ高さに自動リサイズされるため
     fixed+vh のシートは内部スクロールが壊れる(実機で実証)。
     ページ差し替えなら高さ=そのページのコンテンツで常に整合。
   - 浮遊レイヤー(ポップオーバー/メニュー)もゼロに。繰り返しの
     プリセットは行の下にインライン展開するチップ群で選ぶ。
   - トーン: v1(todos-refined)の言語を詳細まで一貫。
     ヘアライン・静かなタイポ・accent 最小・絵文字/緑トグル廃止。
     inset グループ(角丸の白箱)もやめ、フラットな行の積み。
   ============================================================ */
:root {
  --font: -apple-system, BlinkMacSystemFont, system-ui, "Hiragino Sans", sans-serif;
  --fs-title: 14px; --fs-meta: 12px; --fs-section: 11px; --fs-micro: 10.5px;
  --row-min-h: 44px; --row-pad-x: 14px; --card-radius: 14px;
  --circle-size: 19px; --circle-stroke: 1.5px;
}
.theme-light {
  --bg:#fff; --bg-subtle:#f7f7f8;
  --border:#e4e4e7; --border-hair:#eeeef0;
  --text:#1c1c1e; --text-2:#8a8a8e; --text-3:#b4b4b8;
  --accent:#2f6fed; --accent-soft:rgba(47,111,237,.14);
  --add:#2f9e63; --add-wake:rgba(47,158,99,.07);
  --edit:#b07300; --del:#d64545; --overdue:#d64545; --pri:#e08a00;
}
.theme-dark {
  --bg:#1e1e20; --bg-subtle:#27272a;
  --border:#3a3a3e; --border-hair:#2e2e32;
  --text:#f2f2f4; --text-2:#98989e; --text-3:#5c5c62;
  --accent:#6f9cf5; --accent-soft:rgba(111,156,245,.20);
  --add:#55b884; --add-wake:rgba(85,184,132,.10);
  --edit:#d9a441; --del:#e57373; --overdue:#e57373; --pri:#e0a94f;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:#d7dbe0;padding:24px 12px;
     display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.card{width:100%;min-width:320px;max-width:380px;background:var(--bg);color:var(--text);
      border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden;
      box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:var(--fs-title);line-height:1.4}
.card-label{font-size:11px;color:var(--text-3);padding:10px var(--row-pad-x) 0}
.card-header{display:flex;align-items:baseline;gap:8px;padding:12px var(--row-pad-x) 8px}
.card-header h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-header .count{font-size:var(--fs-meta);color:var(--text-2)}
.section{padding:7px var(--row-pad-x) 4px;font-size:var(--fs-section);font-weight:600;
         letter-spacing:.06em;color:var(--text-2);border-top:1px solid var(--border-hair)}
.section:first-of-type{border-top:none}

/* ---- 一覧(v2 のまま = 既に v1 言語) ---- */
.row{padding:0 var(--row-pad-x)}
.row + .row .row-main{border-top:1px solid var(--border-hair)}
.row-main{display:flex;align-items:center;gap:11px;min-height:var(--row-min-h);padding:6px 0}
.circle{flex:none;width:var(--circle-size);height:var(--circle-size);
        border:var(--circle-stroke) solid var(--text-3);border-radius:50%}
.head{flex:1;min-width:0}
.title{font-weight:480;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:baseline;gap:0 8px;min-width:0;
      font-size:var(--fs-meta);color:var(--text-2);margin-top:1px}
.info{flex:none;width:28px;height:28px;border:none;background:none;cursor:pointer;
      border-radius:50%;color:var(--accent);font-size:16px;
      display:flex;align-items:center;justify-content:center}

/* ============ 詳細ページ(v3 の本体) ============
   カードの中身が丸ごとこれに差し替わる。ヘッダは「‹ 戻る(破棄) / 保存」の
   テキストリンク2つだけ(丸ボタンの ✕/✓ をやめ、会話ログのトーンに寄せる)。 */
.page-head{display:flex;align-items:center;justify-content:space-between;
           padding:10px var(--row-pad-x);border-bottom:1px solid var(--border-hair)}
.link{font:inherit;font-size:13px;border:none;background:none;cursor:pointer;padding:4px 2px}
.link-back{color:var(--text-2)}
.link-save{color:var(--accent);font-weight:600}

.detail-body{padding:2px 0 6px}
/* タイトル・メモ: 枠なし入力。ヘアラインで区切るだけ(inset 箱は作らない) */
.d-title{display:block;width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--text);
         border:none;background:none;outline:none;padding:12px var(--row-pad-x) 2px}
.d-notes{display:block;width:100%;font:inherit;font-size:13px;color:var(--text);border:none;
         background:none;outline:none;resize:none;min-height:30px;
         padding:2px var(--row-pad-x) 12px}
.d-notes::placeholder,.d-title::placeholder{color:var(--text-3)}

/* フィールド行: [ラベル][値(入力)…][操作子]。絵文字アイコンなし・フラット */
.f-row{display:flex;align-items:center;gap:10px;min-height:42px;
       padding:4px var(--row-pad-x);border-top:1px solid var(--border-hair);font-size:13.5px}
.f-label{flex:none;width:5em;color:var(--text-2)}
.f-value{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
/* 裸のネイティブ input(値表示=入力の一本化は v2 から継承) */
.naked{font:inherit;font-size:13.5px;color:var(--accent);border:none;background:none;
       padding:0;outline:none}
.naked::-webkit-calendar-picker-indicator{display:none}
.f-value .placeholder{color:var(--text-3)}
/* 操作子: 小型トグル。OS 緑ではなく accent(v1 言語の唯一の彩度)で統一 */
.sw{flex:none;width:34px;height:20px;border-radius:10px;background:var(--border);
    position:relative;border:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
           border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on::after{left:auto;right:2px}
/* 値メニューだった行 → タップで下にインライン展開(chevron の向きで開閉を示す) */
.f-value .val{color:var(--accent)}
.f-value .chev{color:var(--text-3);font-size:11px}
.f-value .muted{color:var(--text-3)}
.f-row.readonly .f-value{color:var(--text-3)}
.f-row .goto{margin-left:auto;color:var(--text-3)}

/* インライン展開部(繰り返しプリセット・曜日・終了)。浮遊させず行の下に流す */
.f-expand{padding:2px var(--row-pad-x) 12px 0;margin-left:calc(5em + 10px + var(--row-pad-x))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;padding:5px 10px;border-radius:14px;
              border:1px solid var(--border);background:var(--bg);color:var(--text-2);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button:disabled{color:var(--text-3);border-style:dashed;cursor:default}
.chips + .chips{margin-top:8px}
.chips .chips-label{font-size:11px;color:var(--text-3);align-self:center;padding-right:2px}
/* 曜日は丸チップ(意味の違い=単一選択でなく複数選択、を形で分ける) */
.chips.wd button{width:28px;height:28px;padding:0;border-radius:50%}
/* 場所・テキスト入力(展開内) */
.f-expand input[type=text]{width:100%;font:inherit;font-size:13px;color:var(--text);
  background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:6px 8px}

/* リスト選択ページ(詳細からの2段目。同じくページ差し替え) */
.pick-row{display:flex;align-items:center;gap:10px;min-height:42px;
          padding:4px var(--row-pad-x);border-top:1px solid var(--border-hair);font-size:13.5px}
.pick-row:first-of-type{border-top:none}
.pick-row .check{margin-left:auto;color:var(--accent);font-weight:700}
.card-footer{padding:8px var(--row-pad-x) 10px;border-top:1px solid var(--border-hair);
             font-size:var(--fs-micro);color:var(--text-3)}
</style>
</head>
<body>
<script>
/* ---- 一覧ページ(現行 v2 と同一の言語。参考用に最小限) ---- */
const list = `
  <div class="card-header"><h2>tasks</h2><span class="count">最終更新 11:10</span></div>
  <div class="section">期限切れ</div>
  <div class="row"><div class="row-main">
    <span class="circle"></span>
    <div class="head"><div class="title">テスト</div>
      <div class="meta"><span style="color:var(--overdue)">昨日</span><span>⟳ 毎月</span></div></div>
  </div></div>
  <div class="row"><div class="row-main">
    <span class="circle"></span>
    <div class="head"><div class="title">追加</div>
      <div class="meta"><span style="color:var(--overdue)">昨日 17:00</span><span>⟳ 毎週 日・土</span></div></div>
    <button class="info">ⓘ</button>
  </div></div>
  <div class="card-footer">一覧は現行のまま(選択中の行に ⓘ)。ⓘ でカードごと詳細ページへ</div>
`;

/* ---- 詳細ページ(閉じた状態) ---- */
const detail = `
  <div class="page-head">
    <button class="link link-back">‹ 戻る</button>
    <button class="link link-save">保存</button>
  </div>
  <div class="detail-body">
    <input class="d-title" value="追加">
    <textarea class="d-notes" placeholder="メモを追加">ああ</textarea>

    <div class="f-row">
      <span class="f-label">期日</span>
      <span class="f-value"><input class="naked" type="date" value="2026-07-14"></span>
      <button class="sw on" aria-label="期日"></button>
    </div>
    <div class="f-row">
      <span class="f-label">時刻</span>
      <span class="f-value"><input class="naked" type="time" value="17:00"></span>
      <button class="sw on" aria-label="時刻"></button>
    </div>
    <div class="f-row">
      <span class="f-label">繰り返し</span>
      <span class="f-value"><span class="val">毎週 日・土</span><span class="chev">⌄</span></span>
    </div>
    <div class="f-row">
      <span class="f-label">リスト</span>
      <span class="f-value"><span class="val">tasks</span></span>
      <span class="goto">›</span>
    </div>
    <div class="f-row">
      <span class="f-label">優先順位</span>
      <span class="f-value">
        <span class="chips">
          <button>なし</button><button aria-pressed="true" style="color:#fff">!</button><button>!!</button><button>!!!</button>
        </span>
      </span>
    </div>
    <div class="f-row">
      <span class="f-label">場所</span>
      <span class="f-value"><span class="placeholder">なし</span></span>
      <button class="sw" aria-label="場所"></button>
    </div>
  </div>
`;

/* ---- 詳細ページ(繰り返しをタップして展開した状態) ----
   プリセットはポップオーバーでなく行下のインライン chip flow。
   毎週/隔週のときだけ曜日 chips 行が続く。終了も同じ文法。 */
const detailOpen = `
  <div class="page-head">
    <button class="link link-back">‹ 戻る</button>
    <button class="link link-save">保存</button>
  </div>
  <div class="detail-body">
    <input class="d-title" value="追加">
    <textarea class="d-notes" placeholder="メモを追加">ああ</textarea>

    <div class="f-row">
      <span class="f-label">期日</span>
      <span class="f-value"><input class="naked" type="date" value="2026-07-14"></span>
      <button class="sw on"></button>
    </div>
    <div class="f-row">
      <span class="f-label">時刻</span>
      <span class="f-value"><input class="naked" type="time" value="17:00"></span>
      <button class="sw on"></button>
    </div>
    <div class="f-row" style="border-bottom:none">
      <span class="f-label">繰り返し</span>
      <span class="f-value"><span class="val">毎週 日・土</span><span class="chev">⌃</span></span>
    </div>
    <div class="f-expand">
      <div class="chips">
        <button>しない</button><button>毎日</button><button>平日</button><button>週末</button>
        <button aria-pressed="true">毎週</button><button>隔週</button>
      </div>
      <div class="chips">
        <button>毎月</button><button>3か月ごと</button><button>6か月ごと</button><button>毎年</button>
        <button disabled>カスタム</button>
      </div>
      <div class="chips wd" style="margin-top:10px">
        <span class="chips-label">曜日</span>
        <button aria-pressed="true">日</button><button>月</button><button>火</button><button>水</button>
        <button>木</button><button>金</button><button aria-pressed="true">土</button>
      </div>
      <div class="chips" style="margin-top:10px">
        <span class="chips-label">終了</span>
        <button aria-pressed="true">しない</button><button>日付</button>
      </div>
    </div>
    <div class="f-row">
      <span class="f-label">リスト</span>
      <span class="f-value"><span class="val">tasks</span></span>
      <span class="goto">›</span>
    </div>
    <div class="f-row">
      <span class="f-label">優先順位</span>
      <span class="f-value">
        <span class="chips">
          <button>なし</button><button aria-pressed="true" style="color:#fff">!</button><button>!!</button><button>!!!</button>
        </span>
      </span>
    </div>
    <div class="f-row">
      <span class="f-label">場所</span>
      <span class="f-value"><span class="placeholder">なし</span></span>
      <button class="sw"></button>
    </div>
  </div>
`;

/* ---- リスト選択ページ(詳細からの2段目) ---- */
const pickList = `
  <div class="page-head">
    <button class="link link-back">‹ 詳細へ戻る</button>
    <span style="font-size:13px;font-weight:600">リスト</span>
    <span style="width:3em"></span>
  </div>
  <div>
    <div class="pick-row">tasks<span class="check">✓</span></div>
    <div class="pick-row">reading list</div>
    <div class="pick-row">買い物と用事</div>
  </div>
`;

function card(theme, label, inner){
  const el = document.createElement('div');
  el.className = 'card ' + theme;
  el.innerHTML = `<div class="card-label">${label}</div>` + inner;
  document.body.appendChild(el);
}
card('theme-light','A. 一覧(現行のまま・参考)', list);
card('theme-light','B. 詳細ページ(カード差し替え・浮遊レイヤーなし)', detail);
card('theme-light','C. 繰り返しタップ → 行下にインライン展開(chips)', detailOpen);
card('theme-light','D. リスト › → 選択ページ', pickList);
card('theme-dark','E. 詳細ページ(ダーク)', detail);
card('theme-dark','F. 展開(ダーク)', detailOpen);
</script>
</body>
</html>
