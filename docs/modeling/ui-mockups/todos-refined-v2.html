<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caldav — todos card v2(一覧 + 詳細=編集ありきセミモーダル)</title>
<style>
/* ============================================================
   todos-refined.html(初版)の更新版モック・第2案。
   フィードバックへの設計回答:
   ①場所が見えない       → 一覧 meta に 📍場所チップ(truncate)。
   ②ⓘ展開がダサい       → 詳細をインライン展開からカード内
                            セミモーダル(約8割被覆)へ。
                            iOS リマインダー詳細に倣い read/編集を
                            分けない「編集ありき」: トグル(日付/時刻/場所)
                            + 値メニュー(繰り返し/優先度)で直接操作。
                            ✕=破棄 / ✓=保存(変更フィールドのみ)。
   ③繰り返しの表示/編集   → 一覧 ⟳バッジ / シートに繰り返し・終了の値行。
   ④ラベルで ⓘ が左ずれ  → becoming ラベルを meta 行右端へ移動。
                            trailing 列は ⓘ 1個の固定幅列になり不動。
   ============================================================ */
:root {
  --font: -apple-system, BlinkMacSystemFont, system-ui, "Hiragino Sans", sans-serif;
  --fs-title: 14px; --fs-meta: 12px; --fs-section: 11px; --fs-micro: 10.5px;
  --row-min-h: 44px; --row-pad-x: 14px; --card-radius: 14px;
  --circle-size: 19px; --circle-stroke: 1.5px;
}
.theme-light {
  --bg:#fff; --bg-subtle:#f7f7f8; --bg-inset:#f2f2f4; --sheet-bg:#f2f2f6;
  --border:#e4e4e7; --border-hair:#eeeef0;
  --text:#1c1c1e; --text-2:#8a8a8e; --text-3:#b4b4b8;
  --accent:#2f6fed; --accent-soft:rgba(47,111,237,.14);
  --add:#2f9e63; --add-wake:rgba(47,158,99,.07);
  --edit:#b07300; --del:#d64545;
  --overdue:#d64545; --pri:#e08a00;
  --scrim:rgba(0,0,0,.28); --toggle-on:#34c759; --toggle-off:#d1d1d6;
}
.theme-dark {
  --bg:#1e1e20; --bg-subtle:#27272a; --bg-inset:#2a2a2e; --sheet-bg:#161618;
  --border:#3a3a3e; --border-hair:#2e2e32;
  --text:#f2f2f4; --text-2:#98989e; --text-3:#5c5c62;
  --accent:#6f9cf5; --accent-soft:rgba(111,156,245,.20);
  --add:#55b884; --add-wake:rgba(85,184,132,.10);
  --edit:#d9a441; --del:#e57373;
  --overdue:#e57373; --pri:#e0a94f;
  --scrim:rgba(0,0,0,.5); --toggle-on:#30d158; --toggle-off:#4a4a4f;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:#d7dbe0;padding:24px 12px;
     display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.card{width:100%;min-width:320px;max-width:380px;background:var(--bg);color:var(--text);
      border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden;
      position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05);
      font-size:var(--fs-title);line-height:1.4}
.card-header{display:flex;align-items:baseline;gap:8px;padding:12px var(--row-pad-x) 8px}
.card-header h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-header .count{font-size:var(--fs-meta);color:var(--text-2)}
.card-label{font-size:11px;color:var(--text-3);padding:0 var(--row-pad-x) 6px}
.section{padding:7px var(--row-pad-x) 4px;font-size:var(--fs-section);font-weight:600;
         letter-spacing:.06em;color:var(--text-2);border-top:1px solid var(--border-hair)}
.section:first-of-type{border-top:none}

/* ============ 行: [circle] [head(2行)] [ⓘ 固定列] ============ */
.row{padding:0 var(--row-pad-x)}
.row + .row .row-main{border-top:1px solid var(--border-hair)}
.row-main{display:flex;align-items:center;gap:11px;min-height:var(--row-min-h);padding:6px 0}
.circle{flex:none;width:var(--circle-size);height:var(--circle-size);
        border:var(--circle-stroke) solid var(--text-3);border-radius:50%}
.circle.done{border-color:var(--accent);background:var(--accent);
             display:flex;align-items:center;justify-content:center}
.circle.done svg{width:11px;height:11px}
.head{flex:1;min-width:0}
.title{font-weight:480;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title .pri{color:var(--pri);font-weight:650;margin-right:4px}
.title .note-mark{color:var(--text-3);margin-left:6px;font-size:12px}
.meta{display:flex;align-items:baseline;gap:0 8px;min-width:0;
      font-size:var(--fs-meta);color:var(--text-2);margin-top:1px}
.meta .overdue{color:var(--overdue)}
.meta .loc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta .tag{margin-left:auto;flex:none;font-size:var(--fs-micro);letter-spacing:.03em;padding-left:8px}
/* ⓘ は iOS 準拠で「選択中の行だけ」に出す(全行常時ではない)。選択行の右端に
   accent 色で出現し、タップで詳細シートへ。非選択行の trailing 列は空(幅も取らない)
   ので、④のずれ問題はそもそも起きない。 */
.info{flex:none;width:28px;height:28px;border:none;background:none;cursor:pointer;
      border-radius:50%;color:var(--accent);font-size:16px;line-height:1;
      display:flex;align-items:center;justify-content:center}
/* 選択状態(iOS: 行タップでタイトルにフォーカスが当たり、メモ行が現れる) */
.row.selected .row-main{background:var(--bg-subtle);border-radius:10px;margin:0 -6px;padding:6px}
/* 下線は出さない(ユーザー判断 2026-07-15)。選択状態は行の背景(bg-subtle)と
   メモ行・ⓘ の出現だけで十分伝わり、下線は iOS のカーソル(キャレット)が担う情報の
   二重表現でノイズだった。 */
.title-edit{font:inherit;font-weight:480;color:var(--text);width:100%;border:none;
            background:none;outline:none;padding:0 0 1px}
.memo-line{font-size:var(--fs-meta);color:var(--text-3);margin-top:2px}
/* 選択中はカードヘッダ右端に ✓(確定して選択解除)が出る */
.header-ok{margin-left:auto;width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;
           background:var(--accent);color:#fff;font-size:12px;font-weight:700;
           display:flex;align-items:center;justify-content:center;align-self:center}

/* ---- becoming ---- */
.becoming-done .circle.done{box-shadow:0 0 0 4px var(--accent-soft)}
.becoming-done .title{text-decoration:line-through;color:var(--text-3)}
.becoming-done .meta .tag{color:var(--accent)}
.becoming-in .row-main{box-shadow:inset 2px 0 0 var(--add);
      background:linear-gradient(to right,var(--add-wake),transparent 55%)}
.becoming-in .meta .tag{color:var(--add)}
.meta .old{color:var(--text-3)} .meta .arrow{color:var(--text-3);padding:0 2px}
.meta .new{color:var(--edit);font-weight:560}
.becoming-edit .meta .tag{color:var(--edit)}

/* ============ 詳細セミモーダル(編集ありき・iOS 詳細準拠) ============
   ヘッダ: ✕(破棄) / 「詳細」 / ✓(保存)。本文はスクロールする
   inset グループの積み: [タイトル+メモ] [日付/時刻トグル] [繰り返し/終了]
   [優先度] [場所] [削除]。トグル ON で直下に入力行が現れる想定
   (このモックでは ON 状態の姿を静的に見せる)。 */
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:84%;
       background:var(--sheet-bg);border-top-left-radius:14px;border-top-right-radius:14px;
       box-shadow:0 -4px 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--text-3);
         opacity:.5;margin:8px auto 2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
            padding:4px 12px 8px}
.sheet-head .h-title{font-size:14px;font-weight:600}
.icon-btn{width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;
          font-size:14px;display:flex;align-items:center;justify-content:center}
.btn-x{background:var(--bg-inset);color:var(--text-2)}
.btn-ok{background:var(--accent);color:#fff;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:4px 12px 16px;
            display:flex;flex-direction:column;gap:12px}
.group{background:var(--bg);border-radius:12px;overflow:hidden}
.g-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;font-size:13.5px}
.g-row + .g-row{border-top:1px solid var(--border-hair)}
.g-row .g-icon{flex:none;width:20px;text-align:center;color:var(--text-2)}
.g-row .g-label{flex:1;min-width:0}
.g-row .g-label .sub{display:block;font-size:12px;color:var(--accent);margin-top:1px}
.g-row .g-value{flex:none;color:var(--text-2);display:flex;align-items:center;gap:4px}
.g-row .g-value.menu::after{content:"⌵";font-size:11px;color:var(--text-3)}
/* タイトル+メモ グループ: iOS と同じく大きめタイトル入力とメモ placeholder */
.title-input{font:inherit;font-size:17px;font-weight:600;color:var(--text);width:100%;
             border:none;background:none;padding:12px 12px 2px;outline:none}
.notes-input{font:inherit;font-size:13px;color:var(--text);width:100%;border:none;
             background:none;padding:2px 12px 12px;outline:none;resize:none;min-height:34px}
.notes-input::placeholder,.title-input::placeholder{color:var(--text-3)}
/* iOS 風トグル(静的) */
.toggle{flex:none;width:44px;height:26px;border-radius:13px;background:var(--toggle-off);position:relative}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;
               border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--toggle-on)}
.toggle.on::after{left:auto;right:2px}
/* 値=入力の一本化(2026-07-15 フィードバック対応)。iOS はラベル下の青い値自体が
   コントロールで、タップ時だけピッカーが出る。Web ではネイティブ input を枠なし・
   accent 色に裸スタイルして「値の位置」に置く — 表示と入力が同一物になり二重表示が
   消える。タップするとブラウザ/WebView のネイティブピッカー(iOS ならカレンダー/
   ホイール)がそのまま開くので、ピッカー UI の自作は不要。 */
.value-input{font:inherit;font-size:12.5px;color:var(--accent);border:none;background:none;
             padding:0;outline:none;display:block;margin-top:1px;width:auto}
.value-input::-webkit-calendar-picker-indicator{display:none} /* 値テキストだけに見せる */
/* 場所などテキスト系だけはトグル ON 時に入力行を出す(自由テキストは「値タップで
   ピッカー」ではなくキーボード入力なので、枠のある input の方が編集可能性が伝わる)。 */
.g-input{display:flex;align-items:center;gap:8px;padding:6px 12px 10px 42px}
.g-input input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);
  background:var(--bg-inset);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
/* 曜日チップ(繰り返し=毎週のときだけ現れる行) */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 12px 10px 42px}
.chips button{font:inherit;font-size:12px;width:30px;height:30px;border-radius:50%;
              border:1px solid var(--border);background:var(--bg-inset);color:var(--text-2);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.del-group .g-row{justify-content:center;color:var(--del);font-weight:560;cursor:pointer}
/* スワイプ削除(iOS 準拠: 削除は詳細シートでなく一覧行の左スワイプで露出する赤ボタン)。
   タッチは touchmove、デスクトップはホイール横 or 行の長押しで露出、を実装時に配線する。 */
.row.swiping{position:relative;overflow:hidden}
.row.swiping .row-main{transform:translateX(-76px);background:var(--bg);position:relative;z-index:1}
.swipe-del{position:absolute;top:0;right:calc(-1 * var(--row-pad-x));bottom:0;width:76px;
           border:none;background:var(--del);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
/* 時間帯など読み取り専用の値行(メニュー矢印なし・減光)。タスクのゾーンが閲覧者と
   異なるときだけ出す情報行 — 編集はスコープ外(黙って壊さないための表示のみ)。 */
.g-value.readonly{color:var(--text-3)}
/* 繰り返しプリセットのポップアップメニュー(iOS の pull-down menu を借景)。
   語彙は iOS リマインダーと同一。カスタム以外は既存 RRULE 語彙への糖衣:
   平日=WEEKLY;BYDAY=MO..FR / 週末=WEEKLY;BYDAY=SA,SU / 隔週=WEEKLY;INTERVAL=2 /
   3・6か月ごと=MONTHLY;INTERVAL=3/6。カスタムは初回スコープ外(複雑形は read-only)。 */
.menu-pop{position:absolute;right:24px;top:96px;width:200px;z-index:3;
          background:var(--bg);border-radius:12px;overflow:hidden;
          box-shadow:0 8px 32px rgba(0,0,0,.28);border:1px solid var(--border-hair)}
.menu-pop .m-row{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13.5px;cursor:pointer}
.menu-pop .m-row + .m-row{border-top:1px solid var(--border-hair)}
.menu-pop .m-row .m-check{width:14px;color:var(--accent);font-weight:700}
.menu-pop .m-row.m-sep{border-top:6px solid var(--bg-inset)}
.menu-pop .m-row.m-disabled{color:var(--text-3);cursor:default}
.card-footer{padding:8px var(--row-pad-x) 10px;border-top:1px solid var(--border-hair);
             font-size:var(--fs-micro);color:var(--text-3)}
</style>
</head>
<body>
<script>
const check = `<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5l2.5 2.5 4.5-5.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* 一覧はデータ駆動で組む。selectedId を渡すと iOS 準拠の選択状態になる:
   その行だけ タイトル=編集 input(フォーカス下線)・「メモを追加」行・ⓘ が出現し、
   カードヘッダ右端に ✓(確定して選択解除)が出る。非選択行に ⓘ は無い。 */
const ROWS = [
  {section:"今日"},
  {cls:"becoming-done", done:true, title:"牛乳を買う", meta:`<span>今日</span><span class="tag">完了</span>`},
  {title:`<span class="pri">!!!</span>処方薬を受け取る`,
   meta:`<span class="overdue">今日 18:00</span><span class="loc">📍 みどり薬局 駅前店</span>`},
  {id:"gomi", title:`燃えるゴミを出す<span class="note-mark">≡</span>`, plainTitle:"燃えるゴミを出す",
   meta:`<span>今日 8:00</span><span>⟳ 毎週 月・木</span>`},
  {section:"今週"},
  {cls:"becoming-in", title:"歯医者を予約", meta:`<span>7/17(金)</span><span class="tag">追加</span>`},
  {id:"report", cls:"becoming-edit", title:"レポート提出",
   meta:`<span class="old">7/15(水)</span><span class="arrow">→</span><span class="new">7/18(土)</span><span class="tag">期日変更</span>`},
  {title:"ジムに行く", meta:`<span>7/16(木) 19:00</span><span>⟳ 毎週 火・木</span><span class="loc">📍 アクトス本店</span>`},
];
function makeList(selectedId, swipeId){
  // 一覧に確定 ✓ は置かない(ユーザー判断 2026-07-15)。選択解除=確定(自動保存):
  // 行外タップ / Enter / 別行の選択のどれでもタイトル・メモを保存して選択が外れる。
  // iOS も「<」で戻れば自動保存であり、確定の明示ボタンはシート(✕/✓ の対)だけに置く。
  let out = `<div class="card-header"><h2>買い物と用事</h2><span class="count">7件 · 更新 3件</span></div>`;
  for (const r of ROWS) {
    if (r.section) { out += `<div class="section">${r.section}</div>`; continue; }
    const sel = r.id !== undefined && r.id === selectedId;
    const circle = r.done ? `<span class="circle done">${check}</span>` : `<span class="circle"></span>`;
    const head = sel
      ? `<div class="head"><input class="title-edit" value="${r.plainTitle}">
           <div class="memo-line">メモを追加</div>
           <div class="meta">${r.meta}</div></div>`
      : `<div class="head"><div class="title">${r.title}</div><div class="meta">${r.meta}</div></div>`;
    const swiped = r.id !== undefined && r.id === swipeId;
    out += `<div class="row ${r.cls ?? ""} ${sel ? "selected" : ""} ${swiped ? "swiping" : ""}">
      <div class="row-main">${circle}${head}${sel ? `<button class="info">ⓘ</button>` : ``}</div>
      ${swiped ? `<button class="swipe-del">削除</button>` : ``}
    </div>`;
  }
  out += `<div class="card-footer">v2: 行タップ=選択(タイトル編集+メモ+ⓘ) / ⓘ=詳細シート / ✓=確定</div>`;
  return out;
}

/* 詳細シート(編集ありき・iOS リマインダー詳細準拠)。
   「燃えるゴミを出す」を開いた状態: 日付 ON(値あり)・時刻 ON・
   繰り返し=毎週(曜日チップ展開)・終了=しない・優先度=中・場所=テキスト ON。 */
const sheet = `
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="icon-btn btn-x">✕</button>
      <span class="h-title">詳細</span>
      <button class="icon-btn btn-ok">✓</button>
    </div>
    <div class="sheet-body">

      <div class="group">
        <input class="title-input" type="text" value="燃えるゴミを出す">
        <textarea class="notes-input" placeholder="メモを追加">シールを貼ってから出す。
粗大ゴミは別途予約。</textarea>
      </div>

      <div class="group">
        <div class="g-row">
          <span class="g-icon">🗓</span>
          <span class="g-label">日付<input class="value-input" type="date" value="2026-07-15"></span>
          <span class="toggle on"></span>
        </div>
        <div class="g-row">
          <span class="g-icon">🕐</span>
          <span class="g-label">時刻<input class="value-input" type="time" value="08:00"></span>
          <span class="toggle on"></span>
        </div>
        <div class="g-row">
          <span class="g-icon">🌐</span>
          <span class="g-label">時間帯</span>
          <span class="g-value readonly">Asia/Tokyo</span>
        </div>
      </div>

      <div class="group">
        <div class="g-row">
          <span class="g-icon">⟳</span>
          <span class="g-label">繰り返し</span>
          <span class="g-value menu">毎週</span>
        </div>
        <div class="chips">
          <button>日</button><button aria-pressed="true">月</button><button>火</button><button>水</button><button aria-pressed="true">木</button><button>金</button><button>土</button>
        </div>
        <div class="g-row">
          <span class="g-icon">⟳̸</span>
          <span class="g-label">繰り返しの終了</span>
          <span class="g-value menu">しない</span>
        </div>
      </div>

      <!-- 整理(iOS の「整理」グループ)。リスト=コレクション移動(2026-07-15 ユーザー確定で
           スコープ入り)。iOS 準拠でドロップダウンではなく「>」で専用の選択ページへ push 遷移する
           (シート内のページ差し替え)。選択肢は list-calendars の結果。移動の実体はサーバー側で
           「移動先へ作成+元から削除」(DAV MOVE 相当・両コレクションの sync-token を進める)。 -->
      <div class="group">
        <div class="g-row">
          <span class="g-icon">☰</span>
          <span class="g-label">リスト</span>
          <span class="g-value">Tasks<span style="color:var(--text-3)"> ›</span></span>
        </div>
        <div class="g-row">
          <span class="g-icon" style="color:var(--pri)">!!!</span>
          <span class="g-label">優先順位</span>
          <span class="g-value menu">中</span>
        </div>
      </div>

      <div class="group">
        <div class="g-row">
          <span class="g-icon">📍</span>
          <span class="g-label">場所</span>
          <span class="toggle on"></span>
        </div>
        <div class="g-input"><input type="text" value="マンション集積所"></div>
      </div>

      <!-- 「タスクを削除」ボタンは置かない(2026-07-15 ユーザー指摘)。iOS の詳細にも削除は無く、
           削除は一覧のスワイプの領分(下の swipe デモ参照)。破壊操作を編集フォームに同居させない。 -->

    </div>
  </div>
`;

/* リスト選択ページ(シート内 push 遷移。iOS の「‹ リスト」ページ準拠)。
   選択肢は list-calendars の結果(このサーバーのコレクションのみ)。現在地に ✓。 */
const listPicker = `
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="icon-btn btn-x">‹</button>
      <span class="h-title">リスト</span>
      <span style="width:32px"></span>
    </div>
    <div class="sheet-body">
      <div class="group">
        <div class="g-row"><span class="g-icon">☰</span><span class="g-label">Tasks</span>
          <span class="g-value" style="color:var(--accent);font-weight:700">✓</span></div>
        <div class="g-row"><span class="g-icon">☰</span><span class="g-label">reading list</span></div>
        <div class="g-row"><span class="g-icon">☰</span><span class="g-label">買い物と用事</span></div>
      </div>
    </div>
  </div>
`;

/* 繰り返しプリセットメニュー(iOS リマインダーと同じ語彙)。シートの上に重ねる。 */
const recurMenu = `
  <div class="menu-pop">
    <div class="m-row"><span class="m-check"></span>しない</div>
    <div class="m-row m-sep"><span class="m-check"></span>毎日</div>
    <div class="m-row"><span class="m-check"></span>平日</div>
    <div class="m-row"><span class="m-check"></span>週末</div>
    <div class="m-row"><span class="m-check">✓</span>毎週</div>
    <div class="m-row"><span class="m-check"></span>隔週</div>
    <div class="m-row"><span class="m-check"></span>毎月</div>
    <div class="m-row"><span class="m-check"></span>3か月ごと</div>
    <div class="m-row"><span class="m-check"></span>6か月ごと</div>
    <div class="m-row"><span class="m-check"></span>毎年</div>
    <div class="m-row m-sep m-disabled"><span class="m-check"></span>カスタム(未対応)</div>
  </div>
`;

function card(theme, label, selectedId, extra, swipeId, fixedHeight){
  const el = document.createElement('div');
  el.className = 'card ' + theme;
  // シート付きカードはシート全項目が(スクロールなしで)見えるよう高めにする(モック都合)。
  // fixedHeight を渡すと実寸検証モード: ホスト(claude.ai の iframe 相当)が与える高さに固定し、
  // シート本文が内部スクロールすることを確認する。実装のカードは常にこの「高さ弾性」で動く。
  el.style.minHeight = extra ? '940px' : '520px';
  if (fixedHeight) { el.style.minHeight = el.style.height = fixedHeight; el.style.overflow = 'hidden'; }
  el.innerHTML = `<div class="card-label">${label}</div>` + makeList(selectedId, swipeId) + (extra ?? '');
  document.body.appendChild(el);
}
card('theme-light','A. 一覧(非選択時。ⓘ は出ない・📍/⟳ を meta に)', null);
card('theme-light','B. 行タップ=選択(タイトル編集+メモ行+ⓘ 出現。行外タップ/Enter=確定)', 'gomi');
card('theme-light','C. 行を左スワイプ → 削除(iOS 準拠。詳細シートに削除は置かない)', null, null, 'report');
card('theme-light','D. ⓘ タップ → 詳細シート(編集ありき・リストは › で選択ページへ)', 'gomi', sheet);
card('theme-light','E. リスト › タップ → 選択ページ(list-calendars・現在地に ✓)', 'gomi', listPicker);
card('theme-light','F. 繰り返しタップ → プリセットメニュー(iOS 語彙=RRULE への糖衣)', 'gomi', sheet + recurMenu);
card('theme-dark', 'G. シートのダーク', 'gomi', sheet);
card('theme-dark', 'H. ダークの一覧(非選択)', null);
card('theme-light','I. 実寸感: ホスト高 460px・一覧(はみ出しは内部スクロール)', null, null, null, '460px');
card('theme-light','J. 実寸感: ホスト高 460px・シート(本文が内部スクロール)', 'gomi', sheet, null, '460px');
</script>
