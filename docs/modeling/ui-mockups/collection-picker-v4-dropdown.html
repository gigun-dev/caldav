<!doctype html>
<!-- コレクション選択 インタラクティブプロトタイプ v4(2026-07-22)
     v3 からのユーザーFB 3点を反映:
     1. 作成行を削除(作成は CalDAV クライアント or LLM 経由の create-calendar で行う —
        カード UI は「選ぶ」だけに徹する)。
     2. 表示は displayname 1つだけ(id 併記はややこしい)。
     3. セミモーダル → ヘッダ見出し直下のドロップダウン(アンカー型メニュー)。
        トリガーの直近に開く=ドロップダウンの定石にも合致。項目数が少ない(2〜5)ので
        画面下からのシートは大げさ、という判断。
     - todos: 単一選択(選んだら閉じて切替)
     - agenda: ON/OFF トグル(開いたまま・裏へ即時反映・外タップで閉じる) -->
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1a1a1a);
    --muted: var(--color-text-secondary, #767676);
    --border: var(--color-border-secondary, rgba(128, 128, 128, 0.25));
    --surface: var(--color-background-secondary, rgba(128, 128, 128, 0.12));
    --accent: #007aff;
    --radius: var(--border-radius-md, 8px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: color-mix(in srgb, var(--bg) 92%, var(--fg)); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px; flex-wrap: wrap; }
  .phone { width: 360px; }
  .phone-label { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card { position: relative; background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; min-height: 420px; }
  .lucide-icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none;
    stroke-linecap: round; stroke-linejoin: round; }

  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .app-title-btn { display: flex; align-items: center; gap: 3px; border: none; background: none;
    padding: 2px 0; font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); cursor: pointer; }
  .app-title-btn .lucide-icon { width: 13px; height: 13px; color: var(--muted); transition: transform .2s; }
  .app-title-btn[aria-expanded="true"] .lucide-icon { transform: rotate(180deg); }
  .updated { font-size: 11px; color: var(--muted); }

  section h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
  ul.rows { margin: 0; padding: 0; }
  ul.rows li { list-style: none; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 15px;
    display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 2px; }

  /* ドロップダウン(ヘッダ見出しのすぐ下にアンカー) */
  .menu-wrap { position: relative; }
  .menu { position: absolute; top: 100%; left: 0; margin-top: 6px; min-width: 220px; z-index: 10;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18); overflow: hidden; }
  .menu.hidden-menu { display: none; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; width: 100%;
    min-height: 44px; border: none; background: none; text-align: left; color: var(--fg);
    font: inherit; font-size: 15px; cursor: pointer; }
  .menu-item + .menu-item { border-top: 1px solid var(--border); }
  .menu-item:active { background: var(--surface); }
  .menu-item .check-slot { width: 16px; flex: none; color: var(--accent); display: flex; }
  .menu-item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 外タップで閉じるための透明スクリム(視覚効果なし) */
  .outside { position: fixed; inset: 0; z-index: 9; }
  .outside.hidden-menu { display: none; }
</style>
</head>
<body>

<!-- ============ todos(単一選択) ============ -->
<div class="phone">
  <div class="phone-label">todos — 単一選択(選んだら閉じる)</div>
  <div class="card">
    <header class="bar">
      <div class="menu-wrap">
        <button class="app-title-btn" id="t-title" aria-expanded="false">
          <span id="t-title-text">リマインダー</span>
          <svg class="lucide-icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu hidden-menu" id="t-menu"></div>
      </div>
      <span class="updated">12:34</span>
    </header>
    <div id="t-body"></div>
  </div>
</div>

<!-- ============ agenda(ON/OFF トグル) ============ -->
<div class="phone">
  <div class="phone-label">agenda — 表示 ON/OFF(開いたまま即反映)</div>
  <div class="card">
    <header class="bar">
      <div class="menu-wrap">
        <button class="app-title-btn" id="a-title" aria-expanded="false">
          <span id="a-title-text">カレンダー</span>
          <svg class="lucide-icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu hidden-menu" id="a-menu"></div>
      </div>
      <span class="updated">7/22〜7/28</span>
    </header>
    <div id="a-body"></div>
  </div>
</div>

<div class="outside hidden-menu" id="outside"></div>

<script>
const CHECK = '<svg class="lucide-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const $ = (id) => document.getElementById(id);
let openMenu = null; // "t" | "a" | null

function setOpen(which) {
  openMenu = which;
  $("t-menu").classList.toggle("hidden-menu", which !== "t");
  $("a-menu").classList.toggle("hidden-menu", which !== "a");
  $("t-title").setAttribute("aria-expanded", String(which === "t"));
  $("a-title").setAttribute("aria-expanded", String(which === "a"));
  $("outside").classList.toggle("hidden-menu", which === null);
}
$("outside").addEventListener("click", () => setOpen(null));

// ---------------- todos: 単一選択 ----------------
const tCols = [
  { id: "tasks", name: "リマインダー", items: ["牛乳を買う", "レポート提出", "宅配を受け取る"] },
  { id: "reading-list", name: "読書リスト", items: ["『達人プログラマー』", "『詳解 Swift』"] },
];
let tCurrent = "tasks";

function tRenderBody() {
  const col = tCols.find((c) => c.id === tCurrent);
  $("t-title-text").textContent = col.name;
  $("t-body").innerHTML = `<section><h2>今日</h2><ul class="rows">${
    col.items.map((i) => `<li>${i}</li>`).join("")}</ul></section>`;
}
function tRenderMenu() {
  $("t-menu").innerHTML = tCols.map((c) => `
    <button class="menu-item" data-id="${c.id}">
      <span class="check-slot">${c.id === tCurrent ? CHECK : ""}</span>
      <span class="name">${c.name}</span>
    </button>`).join("");
  $("t-menu").querySelectorAll(".menu-item").forEach((b) =>
    b.addEventListener("click", () => { tCurrent = b.dataset.id; tRenderBody(); setOpen(null); }));
}
$("t-title").addEventListener("click", () => {
  if (openMenu === "t") { setOpen(null); return; }
  tRenderMenu(); setOpen("t");
});
tRenderBody();

// ---------------- agenda: ON/OFF ----------------
const aCols = [
  { id: "calendar", name: "カレンダー", color: "#007aff",
    events: [["9:00", "Paizaミーティング"], ["15:00", "ゼミ"]] },
  { id: "work", name: "仕事", color: "#ff9500",
    events: [["11:00", "1on1"], ["18:00", "リリース判定"]] },
];
let aVisible = new Set(["calendar", "work"]);

function aRenderBody() {
  const rows = aCols.filter((c) => aVisible.has(c.id))
    .flatMap((c) => c.events.map(([t, s]) => ({ t, s, color: c.color })))
    .sort((x, y) => x.t.localeCompare(y.t));
  $("a-title-text").textContent = aVisible.size === aCols.length
    ? "カレンダー"
    : aCols.filter((c) => aVisible.has(c.id)).map((c) => c.name).join("・") || "カレンダー";
  $("a-body").innerHTML = rows.length === 0
    ? `<p class="empty">表示中のカレンダーがありません</p>`
    : `<section><h2>今日</h2><ul class="rows">${rows.map((r) =>
        `<li><span class="dot" style="background:${r.color}"></span><span style="color:var(--muted);font-size:12px;width:38px">${r.t}</span>${r.s}</li>`).join("")}</ul></section>`;
}
function aRenderMenu() {
  $("a-menu").innerHTML = aCols.map((c) => `
    <button class="menu-item" data-id="${c.id}">
      <span class="check-slot">${aVisible.has(c.id) ? CHECK : ""}</span>
      <span class="name"><span class="dot" style="background:${c.color};display:inline-block;margin-right:6px"></span>${c.name}</span>
    </button>`).join("");
  $("a-menu").querySelectorAll(".menu-item").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.id;
      if (aVisible.has(id)) aVisible.delete(id); else aVisible.add(id);
      aRenderMenu(); aRenderBody(); // 開いたまま即反映
    }));
}
$("a-title").addEventListener("click", () => {
  if (openMenu === "a") { setOpen(null); return; }
  aRenderMenu(); setOpen("a");
});
aRenderBody();
</script>
</body>
</html>
