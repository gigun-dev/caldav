# CI — M1「足場固め」の回帰安全網(checks 専用)。
#
# 方針(CLAUDE.md より):
#   - test + tsc + 層境界 import 制約 を全 push / PR で回す。
#
# deploy はここでは行わない。Cloudflare Workers Builds(ダッシュボードで repo を Git 連携)が
#   main への push で deploy する。理由: API トークンを GitHub secret に置かずに済み、
#   PR には非本番 version(preview URL)が自動生成される。
#   安全性は「main を branch protection で保護 + この check を required status に指定」で担保する
#   (checks を通った PR だけが main にマージ → Cloudflare が deploy)。
#
# なぜ bun か: PM は Bun。テストランナーも bun test。ローカルと CI の実行系を揃える
#   (node/npm と二重管理して乖離するのを避ける)。tsc / depcruise は bunx で叩く。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref の古い実行はキャンセルする(PR 連打時の無駄積みを防ぐ)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test / typecheck / boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: lockfile と package.json の乖離を CI で検出する
      # (ローカルで bun add し忘れコミットを防ぐ)。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 層境界 → tsc → test の順。境界違反や型エラーは「そもそもビルドが壊れている」
      # ので、実行に時間のかかる test より先に落とす(fail-fast)。
      - name: Layer boundaries (dependency-cruiser)
        run: bun run boundaries

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
