# CI — M1「足場固め」の回帰安全網(checks 専用)。
#
# 方針(CLAUDE.md より):
#   - test + tsc + 層境界 import 制約 を全 push / PR で回す。
#
# deploy はここでは行わない。Cloudflare Workers Builds(ダッシュボードで repo を Git 連携)が
#   main への push で deploy する。理由: API トークンを GitHub secret に置かずに済み、
#   PR には非本番 version(preview URL)が自動生成される。
#   安全性は「main を branch protection で保護 + この check を required status に指定」で担保する
#   (checks を通った PR だけが main にマージ → Cloudflare が deploy)。
#
# なぜ bun か: PM は Bun。テストランナーも bun test。ローカルと CI の実行系を揃える
#   (node/npm と二重管理して乖離するのを避ける)。tsc / depcruise は bunx で叩く。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref の古い実行はキャンセルする(PR 連打時の無駄積みを防ぐ)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test / typecheck / boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bun バージョンは pin しない(2026-07-17 非コミット化に伴い撤回)。以前は MCP Apps カード JS
      # バンドルを git にコミットし、その鮮度をバイト一致テストで守っていたため minifier のバイト差が
      # 出ないよう bun を固定していた。今は bundle をコミットせず毎ビルドで entry から生成する運用に
      # 変えたので、バイト一致で守る対象が無く、bun のバージョン差はデプロイ物のバイトを変えるだけで
      # 機能同一(壊れない)。よって固定を外す(setup-bun 既定の latest でよい)。
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: lockfile と package.json の乖離を CI で検出する
      # (ローカルで bun add し忘れコミットを防ぐ)。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MCP Apps カード JS バンドルを生成する(2026-07-17 非コミット化)。*-bundle.ts は gitignore 対象で
      # リポジトリに存在しないため、これ以降のステップ(boundaries/typecheck/test)が src/.../ui/*-app.ts →
      # *-bundle.ts の静的 import を解決できるよう、依存インストール直後・チェック群の前に生成しておく。
      - name: Generate UI bundle
        run: bun run build:ui

      # 層境界 → tsc → test の順。境界違反や型エラーは「そもそもビルドが壊れている」
      # ので、実行に時間のかかる test より先に落とす(fail-fast)。
      - name: Layer boundaries (dependency-cruiser)
        run: bun run boundaries

      - name: Typecheck
        run: bun run typecheck

      # bun test ではなく bun run test を呼ぶ。package.json の test script が
      # 対象ディレクトリを明示列挙しており(test/worker/ を除外)、素の `bun test`
      # だと test/worker/(cloudflare:workers 依存で bun からは import できない)まで
      # 拾って落ちる(Makefile の test ターゲットのコメントと同じ理由)。
      - name: Test
        run: bun run test

      # vitest-pool-workers レーン(実 workerd 上で provider 本体・KV・D1 マイグレーション
      # を検証する test/worker/。詳細は vitest.config.ts / Makefile の test-worker コメント)。
      # secret 不要(テスト専用ダミー secret を vitest.config.ts 側で注入している)。
      - name: Test (workerd)
        run: bun run test:worker
